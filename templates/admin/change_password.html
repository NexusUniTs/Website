<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEXUS // Security</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"><style>:root{--bg:#081839;--surface:#0d2652;--cyan:#1a91f7;--magenta:#8730f1;--muted:#c6d6f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#12316b,#081839 65%);color:#fff;font-family:'Share Tech Mono',monospace}.panel{width:min(500px,calc(100% - 32px));padding:38px;border:1px solid var(--magenta);background:rgba(13,38,82,.95);box-shadow:0 0 18px rgba(135,48,241,.3)}h1{font:700 25px 'Orbitron',sans-serif;color:#fff;letter-spacing:2px}.eyebrow{color:#d09cff;letter-spacing:2px}label{display:block;margin:20px 0 7px;color:#72c4ff}input{width:100%;padding:12px;background:var(--bg);color:#fff;border:1px solid #1b2f5a;font:inherit}input:focus{outline:2px solid var(--cyan)}button{margin-top:24px;padding:12px 18px;border:0;background:var(--cyan);color:#06152e;font:700 13px 'Orbitron',sans-serif;cursor:pointer}.back{display:inline-block;margin-top:20px;color:#72c4ff}.message{color:#a1ffbb}.error{color:#ff9ee7}</style></head><body><main class="panel"><div class="eyebrow">// SECURITY PROTOCOL</div><h1>CHANGE PASSWORD</h1>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="{{ category }}">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current_password">CURRENT PASSWORD</label><input id="current_password" type="password" name="current_password" required><label for="new_password">NEW PASSWORD // MIN 12 CHARS</label><input id="new_password" type="password" name="new_password" minlength="12" required><button type="submit">UPDATE CREDENTIALS</button></form><a class="back" href="{{ url_for('admin.index') }}">← BACK TO CONSOLE</a></main></body></html>
