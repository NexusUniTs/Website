<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEXUS // Upload</title><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"><style>:root{--bg:#081839;--surface:#0d2652;--cyan:#1a91f7;--muted:#c6d6f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#12316b,#081839 65%);color:#fff;font-family:'Share Tech Mono',monospace}.panel{width:min(620px,calc(100% - 32px));padding:38px;border:1px solid var(--cyan);background:rgba(13,38,82,.95);box-shadow:0 0 18px rgba(26,145,247,.3)}h1{font:700 26px 'Orbitron',sans-serif;color:#72c4ff;letter-spacing:2px}p{color:var(--muted)}input[type=file]{width:100%;padding:22px;border:1px dashed var(--cyan);background:var(--bg);color:var(--muted);font:inherit}.actions{display:flex;gap:14px;align-items:center;margin-top:24px}.button{padding:12px 18px;border:0;background:var(--cyan);color:#06152e;font:700 13px 'Orbitron',sans-serif;cursor:pointer}.back{color:#72c4ff}</style></head><body><main class="panel"><p>// MEDIA UPLOAD</p><h1>{{ project.title }}</h1><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp,.gif" required><div class="actions"><button class="button" type="submit">UPLOAD ASSET</button><a class="back" href="{{ url_for('project.edit_view', id=project.id, url='/admin/project/edit/') }}">CANCEL</a></div></form></main></body></html>
