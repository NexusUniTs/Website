<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEXUS // ADMIN ACCESS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#081839;--surface:#0d2652;--border:#1b2f5a;--cyan:#1a91f7;--magenta:#8730f1;--muted:#c6d6f2}
        *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#12316b 0,#081839 55%,#050d20 100%);color:#fff;font-family:'Share Tech Mono',monospace}
        body:before{content:'';position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(26,145,247,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(26,145,247,.04) 1px,transparent 1px);background-size:32px 32px}
        .panel{position:relative;width:min(420px,calc(100% - 32px));padding:40px;border:1px solid var(--cyan);background:rgba(13,38,82,.94);box-shadow:0 0 12px rgba(26,145,247,.45),inset 0 0 30px rgba(26,145,247,.08)}
        .eyebrow{color:#72c4ff;letter-spacing:3px;font-size:12px}.logo{font:900 42px 'Orbitron',sans-serif;letter-spacing:7px;margin:12px 0 8px;text-shadow:3px 0 var(--magenta),-3px 0 var(--cyan)}.subtitle{color:var(--muted);margin:0 0 28px}.field{display:block;margin:18px 0 6px;color:#72c4ff;letter-spacing:1px}input{width:100%;padding:13px;background:#081839;color:#fff;border:1px solid var(--border);font:inherit}input:focus{outline:2px solid var(--cyan);outline-offset:2px}.button{width:100%;margin-top:24px;padding:13px;border:0;background:var(--cyan);color:#06152e;font:700 14px 'Orbitron',sans-serif;letter-spacing:1px;cursor:pointer}.button:hover{background:#72c4ff}.error{color:#ff9ee7;border-left:3px solid var(--magenta);padding-left:10px;margin-top:18px}
    </style>
</head>
<body><main class="panel"><div class="eyebrow">// SECURE CONSOLE</div><h1 class="logo">NEXUS</h1><p class="subtitle">ADMINISTRATIVE ACCESS GATEWAY</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="field" for="username">USERNAME</label><input id="username" name="username" required autocomplete="username"><label class="field" for="password">PASSWORD</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="button" type="submit">AUTHENTICATE //</button></form>{% with messages = get_flashed_messages(category_filter=['error']) %}{% for message in messages %}<p class="error">{{ message }}</p>{% endfor %}{% endwith %}</main></body>
</html>
