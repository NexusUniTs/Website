{% extends 'admin/base.html' %}
{% block head_css %}
    {{ super() }}
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --nexus-bg:#0b2148; --nexus-deep:#081839; --nexus-surface:#0f2b5b; --nexus-border:#1b2f5a; --nexus-cyan:#1a91f7; --nexus-magenta:#8730f1; --nexus-text:#fff; --nexus-muted:#c6d6f2; }
        body { background:var(--nexus-bg); color:var(--nexus-text); font-family:'Share Tech Mono',monospace; }
        .navbar { background:var(--nexus-deep)!important; border-bottom:1px solid var(--nexus-cyan); box-shadow:0 0 18px rgba(26,145,247,.22); }
        .navbar-brand, .navbar a { color:var(--nexus-text)!important; font-family:'Orbitron',sans-serif; }
        .navbar-brand { letter-spacing:2px; text-shadow:0 0 8px rgba(26,145,247,.7); }
        .container, .container-fluid { color:var(--nexus-text); }
        .card, .table, .modal-content, .form-control, .custom-select { background:var(--nexus-surface); color:var(--nexus-text); border-color:var(--nexus-border); }
        .table td, .table th { border-color:var(--nexus-border); }
        .table thead th { color:var(--nexus-cyan); font-family:'Orbitron',sans-serif; font-size:.78rem; }
        .form-control:focus, .custom-select:focus { background:var(--nexus-deep); color:#fff; border-color:var(--nexus-cyan); box-shadow:0 0 0 .2rem rgba(26,145,247,.2); }
        .btn-primary { background:var(--nexus-cyan); border-color:var(--nexus-cyan); color:#06152e; font-weight:700; }
        .btn-primary:hover { background:#55b5ff; border-color:#55b5ff; }
        .btn-danger { background:var(--nexus-magenta); border-color:var(--nexus-magenta); }
        a { color:#72c4ff; }
        .breadcrumb, .alert { background:var(--nexus-deep); border-color:var(--nexus-border); color:var(--nexus-muted); }
        .pagination .page-link { background:var(--nexus-surface); border-color:var(--nexus-border); color:#72c4ff; }
    </style>
{% endblock %}
